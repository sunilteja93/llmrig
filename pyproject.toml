[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrig"
dynamic = ["version"]
description = "Open compatibility and performance intelligence for local AI models and runtimes."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.urls]
Homepage = "https://github.com/sunilteja93/llmrig"
Repository = "https://github.com/sunilteja93/llmrig"
Issues = "https://github.com/sunilteja93/llmrig/issues"

[project.scripts]
llmrig = "llmrig:main"

[tool.setuptools]
py-modules = ["llmrig"]

[tool.setuptools.dynamic]
version = {attr = "llmrig.VERSION"}
