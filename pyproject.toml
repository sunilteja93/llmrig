[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "llmrig"
dynamic = ["version"]
description = "Autopilot for local AI: evidence-driven planning, controlled setup, and measured verification."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "huggingface_hub>=0.34.6,<2",
]
authors = [
  {name = "Sunil Kumar Vadlamani"},
]
maintainers = [
  {name = "Sunil Kumar Vadlamani"},
]
keywords = [
  "local-ai",
  "llm",
  "hardware-compatibility",
  "benchmarking",
  "ollama",
  "omlx",
  "llama-cpp",
  "mlx-lm",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: System :: Hardware",
  "Topic :: System :: Benchmark",
]

[project.urls]
Homepage = "https://github.com/sunilteja93/llmrig"
Repository = "https://github.com/sunilteja93/llmrig"
Issues = "https://github.com/sunilteja93/llmrig/issues"
Changelog = "https://github.com/sunilteja93/llmrig/blob/main/CHANGELOG.md"
Security = "https://github.com/sunilteja93/llmrig/blob/main/SECURITY.md"
Documentation = "https://github.com/sunilteja93/llmrig#readme"
"Hugging Face Space" = "https://huggingface.co/spaces/sunilvadlamani/llmrig-autopilot"
"Benchmark Passports" = "https://huggingface.co/datasets/sunilvadlamani/llmrig-benchmark-passports"
"Hugging Face Collection" = "https://huggingface.co/collections/sunilvadlamani/llmrig-autopilot-for-local-ai-6ab56f4bc732154111d04d9b"
"Launch Discussion" = "https://huggingface.co/spaces/sunilvadlamani/llmrig-autopilot/discussions/1"

[project.scripts]
llmrig = "_llmrig.cli:main"

[tool.setuptools]
py-modules = ["llmrig"]
packages = ["_llmrig"]

[tool.setuptools.dynamic]
version = {attr = "llmrig.VERSION"}
