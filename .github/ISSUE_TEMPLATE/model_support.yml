name: Model or runtime support
description: Request or contribute support for a model family, model tag, or local runtime
title: "[Model support]: "
labels: ["enhancement"]
body:
  - type: input
    id: model
    attributes:
      label: Model family / exact model
      placeholder: "Qwen..., Gemma..., Llama..., etc."
    validations:
      required: true
  - type: input
    id: runtime
    attributes:
      label: Local runtime/backend
      placeholder: "Ollama / MLX / llama.cpp / other"
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Primary sources
      description: Link upstream model/runtime documentation for identifiers, artifact format and size, context, platform support, and runtime commands. Search results and repository names alone are not evidence.
    validations:
      required: true
  - type: textarea
    id: hardware
    attributes:
      label: Hardware tested
      description: If you tested it, include OS, CPU/GPU, RAM/VRAM, runtime version, artifact/quantization, context, and result. Remove private paths and machine identity first.
