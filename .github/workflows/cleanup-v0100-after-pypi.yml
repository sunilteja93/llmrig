name: One-time v0.10.0 merged-branch cleanup

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-v0100-after-pypi.yml"

permissions:
  contents: write

jobs:
  remove-old-merged-branches:
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_REPO: ${{ github.repository }}

    steps:
      - name: Confirm v0.10.0 exists on PyPI and GitHub
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.10.0 --repo "$TARGET_REPO" --json tagName,url
          python - <<'PY'
          import json
          import urllib.request
          with urllib.request.urlopen("https://pypi.org/pypi/llmrig/0.10.0/json", timeout=20) as response:
              data = json.load(response)
          assert data["info"]["version"] == "0.10.0", "PyPI release not visible yet"
          print("Confirmed PyPI v0.10.0 publication")
          PY

      - name: Delete only branches whose tip matches a merged pull request
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.parse
          import urllib.request

          repo = os.environ["TARGET_REPO"]
          token = os.environ["GH_TOKEN"]
          root = "https://api.github.com/repos/" + repo
          headers = {
              "Authorization": "Bearer " + token,
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def request(url, method="GET"):
              req = urllib.request.Request(url, headers=headers, method=method)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  if method == "DELETE":
                      return None
                  return json.load(resp)

          def pages(endpoint):
              results = []
              page = 1
              while True:
                  rows = request(root + endpoint + ("&" if "?" in endpoint else "?") + "per_page=100&page=" + str(page))
                  if not isinstance(rows, list):
                      raise RuntimeError("Expected a list from GitHub")
                  results.extend(rows)
                  if len(rows) < 100:
                      return results
                  page += 1
                  if page > 15:
                      raise RuntimeError("Too many GitHub pagination pages")

          branches = pages("/branches")
          prs = pages("/pulls?state=closed")
          merged = {
              (pr.get("head") or {}).get("ref"): pr
              for pr in prs
              if pr.get("merged_at")
              and (pr.get("head") or {}).get("repo")
              and pr["head"]["repo"].get("full_name") == repo
          }
          removed = []
          kept = []
          for branch in branches:
              name = branch["name"]
              if name == "main" or branch.get("protected"):
                  kept.append(name)
                  continue
              pr = merged.get(name)
              if pr is None or (pr.get("head") or {}).get("sha") != branch["commit"]["sha"]:
                  kept.append(name)
                  continue
              ref = urllib.parse.quote("heads/" + name, safe="/")
              request(root + "/git/refs/" + ref, method="DELETE")
              removed.append(name)

          print("Removed merged branches:", removed)
          print("Preserved main, protected and unmerged branches:", kept)
          if not removed:
              print("No stale merged branches needed cleanup.")
          PY
