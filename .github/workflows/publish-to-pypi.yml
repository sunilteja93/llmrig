name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build distribution
    runs-on: ubuntu-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Install build tooling
        run: python -m pip install build

      - name: Verify release tag matches source version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import llmrig

          expected = f"v{llmrig.VERSION}"
          actual = os.environ["RELEASE_TAG"]
          if actual != expected:
              raise SystemExit(
                  f"release tag {actual!r} does not match source version {expected!r}"
              )
          PY

      - name: Verify release tag commit is contained in main
        run: |
          git fetch origin main
          if ! git merge-base --is-ancestor HEAD origin/main; then
              echo "Release tag must point to a commit contained in main."
              exit 1
          fi

      - name: Build wheel and source distribution
        run: python -m build

      - name: Smoke-test built wheel
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python -m venv "$RUNNER_TEMP/llmrig-release"
          "$RUNNER_TEMP/llmrig-release/bin/python" -m pip install --no-deps dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/llmrig-release/bin/python" - <<'PY'
          import importlib.metadata
          import os
          import _llmrig
          import llmrig

          expected = os.environ["RELEASE_TAG"][1:]
          assert llmrig.VERSION == expected
          assert importlib.metadata.version("llmrig") == expected
          assert not (importlib.metadata.requires("llmrig") or [])
          result = llmrig.solve("qwen3:0.6b")
          assert isinstance(result, llmrig.SolveResult)
          assert result.verification.status == "not_requested"
          PY
          "$RUNNER_TEMP/llmrig-release/bin/llmrig" --version

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest

    environment:
      name: pypi
      url: https://pypi.org/p/llmrig

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist/

      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
