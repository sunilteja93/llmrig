<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">LLMRig terminal flow</title>
<desc id="desc">A terminal-style overview of LLMRig detecting hardware, recommending a local model, setting it up, and benchmarking it.</desc>

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#010409"/>
    <stop offset="1" stop-color="#0d1117"/>
  </linearGradient>
  <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#58a6ff"/>
    <stop offset=".52" stop-color="#7ee787"/>
    <stop offset="1" stop-color="#a371f7"/>
  </linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
    <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#21262d" stroke-width="1" opacity=".22"/>
  </pattern>
</defs>

<rect width="1200" height="430" rx="22" fill="url(#bg)"/>
<rect x="18" y="18" width="1164" height="394" rx="18" fill="url(#grid)" stroke="#30363d" stroke-width="2"/>

<circle cx="48" cy="49" r="7" fill="#ff7b72"/>
<circle cx="72" cy="49" r="7" fill="#e3b341"/>
<circle cx="96" cy="49" r="7" fill="#3fb950"/>

<text x="128" y="56" fill="#8b949e" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18">
  local@rig:~$ python3 llmrig.py
</text>

<text x="58" y="116" fill="#58a6ff" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="29" font-weight="700">
  KNOW WHAT YOUR RIG CAN RUN.
</text>
<text x="58" y="148" fill="#c9d1d9" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16">
  hardware-aware local LLM selection, setup, and benchmarking
</text>

<line x1="94" y1="228" x2="1090" y2="228" stroke="url(#rail)" stroke-width="3" opacity=".75"/>

<g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
  <g>
    <rect x="58" y="197" width="182" height="62" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="78" y="220" fill="#8b949e" font-size="11">01 / DETECT</text>
    <text x="78" y="243" fill="#c9d1d9" font-size="14">CPU · RAM · GPU</text>
  </g>

  <g>
    <rect x="282" y="197" width="182" height="62" rx="10" fill="#0d1117" stroke="#58a6ff" stroke-width="2"/>
    <text x="302" y="220" fill="#8b949e" font-size="11">02 / FIT</text>
    <text x="302" y="243" fill="#c9d1d9" font-size="14">memory · context</text>
  </g>

  <g>
    <rect x="506" y="197" width="182" height="62" rx="10" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
    <text x="526" y="220" fill="#8b949e" font-size="11">03 / RECOMMEND</text>
    <text x="526" y="243" fill="#c9d1d9" font-size="14">model · quant</text>
  </g>

  <g>
    <rect x="730" y="197" width="182" height="62" rx="10" fill="#0d1117" stroke="#7ee787" stroke-width="2"/>
    <text x="750" y="220" fill="#8b949e" font-size="11">04 / SETUP</text>
    <text x="750" y="243" fill="#c9d1d9" font-size="14">verified Ollama ID</text>
  </g>

  <g>
    <rect x="954" y="197" width="182" height="62" rx="10" fill="#0d1117" stroke="#a371f7" stroke-width="2"/>
    <text x="974" y="220" fill="#8b949e" font-size="11">05 / BENCHMARK</text>
    <text x="974" y="243" fill="#c9d1d9" font-size="14">measure locally</text>
  </g>

  <text x="58" y="307" fill="#8b949e" font-size="12">signals</text>
  <text x="132" y="307" fill="#c9d1d9" font-size="13">generation tok/s · prompt eval · accelerator residency · smoke tests</text>

  <text x="58" y="342" fill="#8b949e" font-size="12">principle</text>
  <text x="132" y="342" fill="#7ee787" font-size="13">recommend conservatively. verify on the machine that matters.</text>

  <line x1="58" y1="369" x2="1136" y2="369" stroke="#21262d"/>

  <text x="58" y="395" fill="#8b949e" font-size="12">Python 3.9+ · standard library CLI · macOS / Windows / Linux</text>
  <text x="1136" y="395" text-anchor="end" fill="#58a6ff" font-size="12">LLMRig / OPEN SOURCE</text>
</g>
</svg>
